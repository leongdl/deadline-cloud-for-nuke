specificationVersion: jobtemplate-2023-09
name: Default Docker Nuke Job Template
parameterDefinitions:
- name: NukeScriptFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Nuke Script File
    fileFilters:
    - label: Nuke Script Files
      patterns:
      - '*.nk'
    - label: All Files
      patterns:
      - '*'
  description: The Nuke script file to render.
- name: GizmoDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Gizmo Directory
  description: The directory containing Nuke Gizmo files used by this job.
  default: './gizmos'
- name: OCIOConfigPath
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The OCIO config file used by this job.
- name: Frames
  type: STRING
  description: The frames to render. E.g. 1-3,8,11-15
  minLength: 1
- name: WriteNode
  type: STRING
  userInterface:
    control: DROPDOWN_LIST
    label: Write Node
  description: Which write node to render ('All Write Nodes' for all of them)
  default: All Write Nodes
  allowedValues:
  - All Write Nodes
- name: View
  type: STRING
  userInterface:
    control: DROPDOWN_LIST
  description: Which view to render ('All Views' for all of them)
  default: All Views
  allowedValues:
  - All Views
- name: ProxyMode
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Proxy Mode
  description: Render in Proxy Mode.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: ContinueOnError
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Continue On Error
  description: Continue processing when errors occur.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: ECR_REGISTRY
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: ECR Registry
  description: The ECR registry URL (e.g., 224071664257.dkr.ecr.us-west-2.amazonaws.com).
  default: ''
- name: NUKE_REPOSITORY
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Nuke Repository
  description: The repository name in ECR.
  default: ''
- name: NUKE_TAG
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Nuke Tag
  description: The Docker image tag to use.
  default: ''
- name: AWS_REGION
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: AWS Region
  description: The AWS region for ECR (e.g., us-west-2).
  default: 'us-west-2'
steps:
- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.Frames}}'
  stepEnvironments:
  - name: Nuke
    description: Runs Nuke in Docker container with a script file loaded.
    script:
      embeddedFiles:
      - name: initData
        filename: init-data.yaml
        type: TEXT
        data: |
          continue_on_error: {{Param.ContinueOnError}}
          proxy: {{Param.ProxyMode}}
          script_file: '{{Param.NukeScriptFile}}'
          write_nodes:
          - '{{Param.WriteNode}}'
          views:
          - '{{Param.View}}'
      - name: dockerEnter
        filename: docker-enter.sh
        type: TEXT
        runnable: true
        data: |
          #!/bin/bash
          set -e
          echo "Logging in to Amazon ECR..."
          aws ecr get-login-password --region {{Param.AWS_REGION}} | docker login --username AWS --password-stdin {{Param.ECR_REGISTRY}}
          echo "Pulling Docker image..."
          docker pull {{Param.ECR_REGISTRY}}/{{Param.NUKE_REPOSITORY}}:{{Param.NUKE_TAG}}
          echo "Running Docker container for environment check..."
          docker run --rm \
            -v "$(pwd):$(pwd)" \
            -w "$(pwd)" \
            -e FLEXLM_TIMEOUT \
            -e ADSKFLEX_LICENSE_FILE \
            -e foundry_LICENSE \
            -e PIXAR_LICENSE_FILE \
            -e g_licenseServerRLM \
            -e redshift_LICENSE \
            -e SESI_LMHOST \
            -e VRAY_AUTH_CLIENT_FILE_PATH \
            -e VRAY_AUTH_CLIENT_SETTINGS \
            {{Param.ECR_REGISTRY}}/{{Param.NUKE_REPOSITORY}}:{{Param.NUKE_TAG}} \
            bash -c "env | sort && echo '---' && ls -la"
      actions:
        onEnter:
          command: '{{ Env.File.dockerEnter }}'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
        onExit:
          command: bash
          args:
          - -c
          - echo "Docker container cleanup complete"
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
  script:
    embeddedFiles:
    - name: runData
      filename: run-data.yaml
      type: TEXT
      data: 'frameRange: "{{Task.Param.Frame}}"'
    - name: dockerRun
      filename: docker-run.sh
      type: TEXT
      runnable: true
      data: |
        #!/bin/bash
        set -e
        echo "Pulling Docker image..."
        docker pull {{Param.ECR_REGISTRY}}/{{Param.NUKE_REPOSITORY}}:{{Param.NUKE_TAG}}
        echo "Running Nuke render in Docker container..."
        docker run --rm \
          --network host \
          --ulimit stack=52428800 \
          -v "$(pwd):$(pwd)" \
          -w "$(pwd)" \
          -e FLEXLM_TIMEOUT \
          -e ADSKFLEX_LICENSE_FILE \
          -e foundry_LICENSE \
          -e PIXAR_LICENSE_FILE \
          -e g_licenseServerRLM \
          -e redshift_LICENSE \
          -e SESI_LMHOST \
          -e VRAY_AUTH_CLIENT_FILE_PATH \
          -e VRAY_AUTH_CLIENT_SETTINGS \
          {{Param.ECR_REGISTRY}}/{{Param.NUKE_REPOSITORY}}:{{Param.NUKE_TAG}} \
          bash -c "echo 'Setting up Nuke environment...' && export FLEXLM_TIMEOUT=3000000 && cd /opt/nuke/Nuke16.0v1 && echo 'Displaying license environment variables:' && echo \"Autodesk License endpoint: \$ADSKFLEX_LICENSE_FILE\" && echo \"Autodesk Timeout set to: \$FLEXLM_TIMEOUT\" && echo \"Foundry License endpoint: \$foundry_LICENSE\" && echo \"Renderman License endpoint: \$PIXAR_LICENSE_FILE\" && echo \"C4D License endpoint: \$g_licenseServerRLM\" && echo \"Redshift/Red Giant License endpoint: \$redshift_LICENSE\" && echo \"SideFX License endpoint: \$SESI_LMHOST\" && echo \"Vray Auth client file path set to: \$VRAY_AUTH_CLIENT_FILE_PATH\" && echo \"Vray License endpoint: \$VRAY_AUTH_CLIENT_SETTINGS\" && echo 'Displaying Nuke environment variables:' && echo \"Nuke path: /opt/nuke/Nuke16.0v1\" && echo \"Current directory: \$(pwd)\" && echo 'Nuke environment ready. Starting render...' && SCRIPT_DIR=\$(dirname '{{Param.NukeScriptFile}}') && if [ '{{Param.WriteNode}}' = 'All Write Nodes' ]; then ./Nuke16.0 -t -x -F {{Task.Param.Frame}} --var output_path:\$SCRIPT_DIR '{{Param.NukeScriptFile}}'; else ./Nuke16.0 -t -X '{{Param.WriteNode}}' -F {{Task.Param.Frame}} --var output_path:\$SCRIPT_DIR '{{Param.NukeScriptFile}}'; fi"
    actions:
      onRun:
        command: '{{ Task.File.dockerRun }}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
